name: Auto Update TVBox Configs

"on":
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:
    inputs:
      sites_per_part:
        description: "每份单仓最多站点数（正整数）"
        type: string
        required: true
        default: "500"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test configs and build site
        id: build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          SITES_PER_PART: ${{ inputs.sites_per_part || '500' }}
        # 干净目录确保历史产物不会进入本轮部署。
        run: |
          rm -rf output
          python scripts/update.py
      - name: Save diagnostic results
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-test-results
          path: output/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Job summary
        run: cat output/REPORT.md >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
